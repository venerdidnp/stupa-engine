<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stupa-engine -- Three.js viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="panel">
    <strong>stupa-engine</strong><br>
    drag to orbit &middot; wheel to zoom<br>
    <button id="export">Export PPM</button>
    <div id="status"></div>
  </div>

  <!-- Pinned Three.js version from a CDN; the addons resolve through the
       "three/addons/" prefix, the standard Three.js importmap layout. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
